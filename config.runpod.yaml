# litiGPT configuration for RunPod GPU pods.
#
# Paths point at /workspace, RunPod's network volume, so data, adapters and
# MLflow runs survive pod teardown. Tracked in git on purpose: it contains no
# secrets (credentials come from the environment).
#
# Override per run with:  python -m litigpt.pipeline --step train --config config.runpod.yaml

data:
  raw_dir: "/workspace/data/raw"
  submission_filename: "litigi_submissions.parquet"
  comments_filename: "litigi_comments.parquet"
  processed_dir: "/workspace/data/processed"
  training_dir: "/workspace/data/training"
  # Same 30-persona cohort as config.top30.yaml, selected automatically so it
  # stays reproducible from the raw dump. This file differs from that one only
  # in its paths.
  target_usernames: []
  top_n_users: 30
  max_pairs_per_user: 2000
  exclude_authors: ["[deleted]", "[removed]", "AutoModerator"]
  strip_quoted_text: true
  min_comment_length: 10
  max_comment_length: 512
  min_score: 1

model:
  # phi-3-mini is the cheapest useful base and needs no gated-repo access.
  # For Llama/Mistral set HF_TOKEN on the pod first.
  base_model: "microsoft/phi-3-mini-4k-instruct"
  # Alternatives:
  # - "mistralai/Mistral-7B-Instruct-v0.3"
  # - "meta-llama/Llama-3.1-8B-Instruct"   (gated)
  # Name it for the run it produces, not the generic template name. The
  # post-training watchdog locates the adapter by search rather than by a
  # path copied from here, so the two can no longer disagree - but a stale
  # name still makes the artifact on the pod hard to identify.
  output_dir: "/workspace/models/litigpt_top30_lora"

training:
  # 2, not 3. Confirmed on the corrected run (2026-09-21, 3352 steps, 2h49m):
  # eval_loss fell 3.0371 -> 2.8758 over six 500-step evals, the last interval
  # buying 0.0027 - already under early_stopping_threshold. A third epoch
  # would buy noise. See config.top30.yaml for why these numbers are higher
  # than the first run's and not comparable with them.
  num_epochs: 2
  # 4 x 8 keeps the effective batch at 32 while halving peak activation memory,
  # which matters because max_seq_length has doubled. Sized for a 24GB card
  # (RTX 4090 / A5000); only ~7.7GB was in use on the first run, so there is
  # headroom to raise this if nvidia-smi agrees mid-run.
  batch_size: 4
  gradient_accumulation_steps: 8
  # Halved from 2e-4: detected target_modules raise trainable parameters from
  # 17.8M to 50.3M, and holding the rate while tripling capacity is how an
  # adapter overwrites instruction-following instead of layering a voice on it.
  learning_rate: 1.0e-4
  # Loss is masked to the reply, so an example whose prompt alone fills the
  # window has nothing to learn from. At 512 that was 4.5% of the set.
  max_seq_length: 1024
  warmup_ratio: 0.05
  train_ratio: 0.9
  # Sequence lengths here are very uneven (median 164 tok, p95 502).
  # Grouping by length cuts padding waste from ~103% to near zero.
  group_by_length: true
  # The val split is ~6k examples; at the default eval_steps of 50 that is
  # ~100 evaluations and about two extra hours.
  eval_steps: 500
  save_steps: 500
  logging_steps: 25
  early_stopping_patience: 3
  early_stopping_threshold: 0.005

lora:
  # 30 personas is a lot to separate; r=32 gives more capacity than the r=16
  # that was tuned for a single user.
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  # Empty = detect from the model. These were Llama names against a phi-3
  # base, which fuses q/k/v into qkv_proj and gate/up into gate_up_proj, so
  # five of the seven silently matched nothing. See config.top30.yaml.
  target_modules: []

inference:
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1

user_classification:
  strategy: "random"   # "random" or "keyword"
  user_keywords: {}

bot:
  subreddit: "test"
  # Required to deploy: the bot posts only as users named here, never as an
  # anonymous fallback. Every name must be in the adapter's manifest
  # (litigpt_manifest.json). Each reply picks one at random unless the
  # keyword strategy prefers one.
  available_users: []
  trigger_keywords: []
  reply_probability: 0.2
  min_score_threshold: 1
  cooldown_seconds: 120
  max_context_depth: 3
  bot_username: "litiGPT"
