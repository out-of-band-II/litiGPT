data:
  raw_dir: "data/raw"
  submission_filename: "litigi_submissions.jsonl"
  comments_filename: "litigi_comments.parquet"
  processed_dir: "data/processed"
  training_dir: "data/training"
  target_username: ["specific_reddit_user", "another_user"]
  min_comment_length: 10
  max_comment_length: 512
  min_score: 1

model:
  base_model: "meta-llama/Llama-3.1-8B-Instruct"
  # Alternatives:
  # - "mistralai/Mistral-7B-Instruct-v0.2"
  # - "microsoft/phi-3-mini-4k-instruct"
  output_dir: "models/reddit_bot_lora"

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  max_seq_length: 512
  warmup_ratio: 0.05
  
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  
inference:
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1

bot:
  subreddit: "test"
  trigger_keywords: []  # Empty list = respond to all
  reply_probability: 0.2
  min_score_threshold: 1
  cooldown_seconds: 120
  max_context_depth: 3