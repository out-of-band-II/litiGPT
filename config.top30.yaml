# litiGPT — top-30 multi-user cohort.
#
# target_usernames is deliberately empty: the cohort is selected automatically
# as the 30 most prolific authors, so it stays reproducible from the raw dump
# without pinning 30 names here.
#
#   python -m litigpt.pipeline --step extract    --config config.top30.yaml
#   python -m litigpt.pipeline --step preprocess --config config.top30.yaml
#   python -m litigpt.pipeline --step train      --config config.top30.yaml

data:
  raw_dir: "data/raw"
  submission_filename: "litigi_submissions.parquet"
  comments_filename: "litigi_comments.parquet"
  processed_dir: "data/processed"
  training_dir: "data/training"

  target_usernames: []      # empty -> use top_n_users
  top_n_users: 30
  # #1 has ~12,700 usable pairs and #30 ~2,100. Capping at 2,000 keeps the mix
  # balanced; without it the model over-indexes on the loudest few.
  max_pairs_per_user: 2000
  exclude_authors: ["[deleted]", "[removed]", "AutoModerator"]
  strip_quoted_text: true

  min_comment_length: 10
  max_comment_length: 512
  min_score: 1

model:
  base_model: "microsoft/phi-3-mini-4k-instruct"
  output_dir: "models/litigpt_top30_lora"

training:
  # 2, not 3. Confirmed on the corrected run (2026-09-21, 3352 steps, 2h49m):
  # eval_loss 3.0371 -> 2.9475 -> 2.9084 -> 2.8908 -> 2.8784 -> 2.8758 at
  # 500-step intervals. The last interval bought 0.0027, already under the
  # early_stopping_threshold below, so a third epoch would buy noise.
  #
  # Do not compare those numbers with the first run's (2.2431 -> 1.9634).
  # That run scored the whole templated example, so most of its loss came
  # from the system prompt and the parent comments, which are free at
  # inference. This one scores only the reply. Higher number, harder task.
  num_epochs: 2
  # 4 x 8 keeps the effective batch at 32, unchanged from the first run, while
  # halving peak activation memory -- which matters because max_seq_length has
  # doubled. Raise back to 8 x 4 if nvidia-smi shows headroom mid-run.
  batch_size: 4
  gradient_accumulation_steps: 8
  # 1e-4, halved from 2e-4. The corrected target_modules raise the trainable
  # parameter count from 17.8M to 50.3M, and holding the learning rate while
  # nearly tripling capacity is how an adapter overwrites the base model's
  # instruction-following instead of layering a voice on top of it.
  learning_rate: 1.0e-4
  # 1024, raised from 512. Loss is now masked to the reply, so an example
  # whose prompt alone fills the window has nothing left to learn from. At
  # 512 that was 4.5% of the set; at 1024 it is 0.6%. group_by_length means
  # the extra room is only paid for on the batches that actually need it.
  max_seq_length: 1024
  warmup_ratio: 0.05
  train_ratio: 0.9
  group_by_length: true
  # The val split is 5,988 examples = 749 batches per evaluation. At the
  # default eval_steps of 50 that is ~100 evaluations, adding roughly two
  # hours to the run. Ten evaluations is plenty to track convergence.
  eval_steps: 500
  save_steps: 500
  logging_steps: 25
  # Three flat evaluations (1500 steps) ends the run. "Flat" means an
  # improvement below 0.005 -- the fourth-decimal drift at the end of the
  # first run would otherwise count as progress forever.
  early_stopping_patience: 3
  early_stopping_threshold: 0.005

lora:
  # 30 personas is a lot to separate; r=32 gives the adapter more capacity than
  # the r=16 that was tuned for a single user.
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  # Empty = detect from the loaded model. This used to name the seven Llama
  # projections, of which phi-3 has two: it fuses q/k/v into qkv_proj and
  # gate/up into gate_up_proj. PEFT adapted o_proj and down_proj, ignored the
  # rest without a word, and still wrote all seven into adapter_config.json.
  # The first run trained 17.8M parameters with nothing on the attention
  # queries or keys. Detection gives qkv_proj, o_proj, gate_up_proj,
  # down_proj -- about 50M parameters, and the training refuses to start now
  # if a name matches nothing.
  target_modules: []

inference:
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1

user_classification:
  strategy: "random"
  user_keywords: {}

bot:
  subreddit: "test"
  # Required to deploy: the bot posts only as users named here, never as an
  # anonymous fallback. Every name must be in the adapter's manifest
  # (litigpt_manifest.json). Each reply picks one at random unless the
  # keyword strategy prefers one.
  available_users: []
  trigger_keywords: []
  reply_probability: 0.2
  min_score_threshold: 1
  cooldown_seconds: 120
  max_context_depth: 3
  bot_username: "litiGPT"
