# litiGPT default configuration.
#
# This is the tracked template, and the one the containers ship as config.yaml.
# Every key below exists in litigpt/config.py; anything you add that does not
# is accepted silently by Pydantic and then ignored, so a typo here is
# invisible. Copy to config.yaml (gitignored) for local edits, or pass
# --config to point at one of the purpose-built files:
#
#   config.top30.yaml   the real 30-persona run, with its reasoning written out
#   config.smoke.yaml   a tiny end-to-end rehearsal, minutes and free
#   config.runpod.yaml  /workspace paths for a RunPod network volume

data:
  raw_dir: "data/raw"
  submission_filename: "litigi_submissions.parquet"
  comments_filename: "litigi_comments.parquet"
  processed_dir: "data/processed"
  training_dir: "data/training"

  # Name the personas explicitly, or leave this empty and set top_n_users to
  # pick the N most prolific authors from the dump. An explicit list wins.
  target_usernames: []
  top_n_users: 0

  # Cap pairs per user so one prolific author cannot dominate the mix.
  # 0 disables the cap. In the top-30 cohort the loudest author had six times
  # the material of the quietest.
  max_pairs_per_user: 0

  exclude_authors: ["[deleted]", "[removed]", "AutoModerator"]

  # Drop the quoted parent ("> ...") from a user's own reply. The parent is
  # already supplied as context, so keeping it teaches the model to copy.
  strip_quoted_text: true

  # Replies under this many words are not trained on. A 10-character floor
  # used to stand here; it kept "esattamente" and dropped "esatto", and still
  # let 15% of training replies be under 5 words, which the model learned
  # to reproduce as one-liners.
  min_comment_words: 5
  # Characters of cleaned text; longer comments are dropped, not truncated.
  # 512 cut away the long-form writing of the personas who write long.
  max_comment_length: 2000
  # null trains on comments whatever their score. A floor mostly removes
  # score-0 comments, which in an argument subreddit are part of the voice.
  min_score: null
  # Drop comments posted as a moderator (removal notices, rule reminders).
  # Needs the 'distinguished' column from the current preliminary.py.
  exclude_moderator_comments: true

model:
  # phi-3-mini is the cheapest useful base and needs no gated-repo access.
  # For Llama or Mistral, set HF_TOKEN first.
  base_model: "microsoft/phi-3-mini-4k-instruct"
  # Alternatives:
  # - "mistralai/Mistral-7B-Instruct-v0.3"
  # - "meta-llama/Llama-3.1-8B-Instruct"   (gated)
  output_dir: "models/reddit_bot_lora"
  # Why this run exists, in a sentence. It goes into the adapter's manifest
  # beside the version id assigned at training start, and shows in
  # `python -m litigpt.registry list`. Training refuses an output_dir that
  # already holds a completed adapter.
  notes: ""

training:
  num_epochs: 2
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4

  # Loss is masked to the reply, so an example whose prompt alone fills the
  # window has nothing left to learn from and is dropped.
  max_seq_length: 1024

  warmup_ratio: 0.05
  train_ratio: 0.9

  # Batch similar-length sequences together. Padding waste on this data is
  # ~103% without it, which roughly doubles the cost of a rented GPU.
  group_by_length: true

  # Evaluation cadence. These defaults suit a small set; on a large validation
  # split a low eval_steps dominates runtime, so raise it as the data grows.
  eval_steps: 50
  save_steps: 100
  logging_steps: 10
  save_total_limit: 3

  # Stop when eval_loss has not improved by more than the threshold for this
  # many consecutive evaluations. 0 disables it. The threshold matters as much
  # as the patience: fourth-decimal drift is not progress, but without a floor
  # it resets the counter forever.
  early_stopping_patience: 3
  early_stopping_threshold: 0.005

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  # Empty means detect from the loaded model, which is the right default.
  # Projection names are architecture-specific -- phi-3 fuses q/k/v into
  # qkv_proj and gate/up into gate_up_proj -- and a hardcoded Llama list
  # matched two of seven names here, training a third of the intended
  # parameters with nothing on the attention queries or keys. Training now
  # refuses to start if a named module matches nothing.
  target_modules: []

inference:
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  # Replies under this many words are resampled; 0 turns it off. In chat a
  # two-word reply reads as the model having nothing to say, and a short
  # message draws them most.
  min_reply_words: 5
  # Sampled together in one batch; the first to clear min_reply_words is the
  # reply. Cheap on a GPU, multiplies the work on CPU -- use 1 there.
  reply_candidates: 3

user_classification:
  # Which persona the bot answers as. "random" picks from bot.available_users;
  # "keyword" routes on the topic keywords below. There is no model-based
  # router, by design -- see litigpt/inference/classifier.py.
  strategy: "random"
  user_keywords: {}

bot:
  subreddit: "test"
  # Required to deploy: the bot posts only as users named here, never as an
  # anonymous fallback. Every name must be in the adapter's manifest
  # (litigpt_manifest.json). Each reply picks one at random unless the
  # keyword strategy prefers one.
  available_users: []
  trigger_keywords: []      # empty = consider every comment
  reply_probability: 0.2
  min_score_threshold: 1
  cooldown_seconds: 120
  max_context_depth: 3
  bot_username: "your_bot_username"
